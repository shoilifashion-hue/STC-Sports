name: Update STC Sports Playlist

on:
  repository_dispatch:
    types: [source_updated]

  workflow_dispatch:

  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]" selectolax playwright

      - name: Install Playwright Chromium with system dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strmcntr.json strmcntr.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update playlist [skip ci]"
            git push
          fi
