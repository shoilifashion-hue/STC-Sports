name: Update StreamFree Playlist

on:
  repository_dispatch:
    types: [source_updated]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]" selectolax

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # তৈরি হওয়া ফাইলগুলো যোগ করা
          git add -A
          
          # যদি নতুন কোনো পরিবর্তন থাকে তবেই পুশ করবে
          if git diff --staged --quiet; then
            echo "No changes in playlist. Skipping commit."
          else
            git commit -m "Auto-update StreamFree playlist [$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M %p BST')]"
            git push
          fi
